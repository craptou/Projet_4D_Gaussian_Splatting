# Upstream-documented Python/PyTorch/CUDA versions; ancillary pins are ours.
name: skate4d-upstream
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.7.12
  - pip=23.1.2
  - pytorch=1.13.1
  - torchvision=0.14.1
  - torchaudio=0.13.1
  - pytorch-cuda=11.6
  - numpy=1.21.6
  - pillow=9.5.0
  - pip:
      - mmcv==1.6.0
      - matplotlib==3.5.3
      - lpips==0.1.4
      - plyfile==0.9
      - pytorch-msssim==1.0.0
      - open3d==0.17.0
      - imageio[ffmpeg]==2.31.2
      - scikit-image==0.19.3
      - tqdm==4.66.1
      - scipy==1.7.3
      - ninja==1.11.1.1
