[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skate-trick-4dgs"
version = "0.1.0"
description = "Reproducible multi-view skate replay preparation for 4DGaussians"
requires-python = ">=3.11"
dependencies = ["Pillow==11.3.0"]

[tool.setuptools.packages.find]
where = ["src"]
